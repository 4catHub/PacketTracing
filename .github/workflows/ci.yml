name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PORT: "5000"
      BASE_PATH: "/"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Replit can update workspace package.json files before pnpm-lock.yaml is
      # regenerated. Install from the current workspace manifests so CI reaches
      # the typecheck/build validation instead of failing on pre-existing lock drift.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck and build workspace
        run: pnpm run build

  visual-qa:
    name: Browser visual QA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: "5000"
      BASE_PATH: "/"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: |
          pnpm add -Dw playwright@1.55.0 --ignore-workspace-root-check
          pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @workspace/visualizer build
      - name: Start preview
        run: |
          pnpm --filter @workspace/visualizer serve -- --port 4173 > /tmp/visualizer.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/workflows/google-dns >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/visualizer.log
          exit 1
      - name: Capture and assert
        run: |
          cat > visual-qa.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs";
          const browser=await chromium.launch({headless:true});
          fs.mkdirSync("visual-qa",{recursive:true});
          for(const c of [
            {name:"desktop-light",width:1440,height:1100,dark:false},
            {name:"desktop-dark",width:1440,height:1100,dark:true},
            {name:"mobile-light",width:390,height:844,dark:false},
            {name:"mobile-dark",width:390,height:844,dark:true},
          ]){
            const page=await browser.newPage({viewport:{width:c.width,height:c.height},reducedMotion:"reduce"});
            await page.addInitScript(d=>localStorage.setItem("theme",d?"dark":"light"),c.dark);
            await page.goto("http://127.0.0.1:4173/workflows/google-dns",{waitUntil:"networkidle"});
            await page.getByText("Focused interaction").waitFor();
            const svg=page.locator('svg[role="img"]').first();
            for(const label of ["BROWSER","OS CACHE","RESOLVER","ROOT NS","TLD NS","AUTH NS","WEB SERVER","RENDER"]){
              if(await svg.getByText(label,{exact:true}).count()!==1) throw new Error(c.name+": missing "+label);
            }
            if(await svg.locator("line").count()<8) throw new Error(c.name+": baseline topology missing");
            const box=await svg.boundingBox();
            if(!box||box.x<0||box.x+box.width>c.width+1) throw new Error(c.name+": viewport overflow");
            await page.screenshot({path:`visual-qa/${c.name}-step1.png`,fullPage:true});
            for(let i=0;i<6;i++) await page.getByTitle("다음 단계").click();
            await page.getByText("7. TCP 3-way handshake").waitFor();
            const tcp=page.locator('svg[role="img"]').first();
            for(const label of ["1. SYN","2. SYN-ACK","3. ACK"]){
              if(await tcp.getByText(label,{exact:true}).count()!==1) throw new Error(c.name+": missing "+label);
            }
            if(await tcp.locator("path[marker-end]").count()!==3) throw new Error(c.name+": TCP path count");
            await page.screenshot({path:`visual-qa/${c.name}-step7.png`,fullPage:true});
            await page.close();
          }
          await browser.close();
          EOF
          node visual-qa.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: visual-qa/*.png
