name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PORT: "5000"
      BASE_PATH: "/"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Replit can update workspace package.json files before pnpm-lock.yaml is
      # regenerated. Install from the current workspace manifests so CI reaches
      # the typecheck/build validation instead of failing on pre-existing lock drift.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck and build workspace
        run: pnpm run build
