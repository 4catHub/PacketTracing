kind = "web"
previewPath = "/"
title = "PackeTracing - 아키텍처 다이어그램 시각화"
version = "1.0.0"
id = "artifacts/visualizer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20016

[services.development]
run = "pnpm --filter @workspace/visualizer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/visualizer", "run", "build" ]
publicDir = "artifacts/visualizer/dist/public"
serve = "static"

# Static per-route HTML is generated at build time. No wildcard SPA rewrite.
# Replit's actual 404 status handling must be confirmed after deployment.

[services.env]
PORT = "20016"
BASE_PATH = "/"
APP_URL = "https://4d4cat.com"
