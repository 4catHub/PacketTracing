kind = "web"
previewPath = "/"
title = "알고리즘·워크플로우 시각화"
version = "1.0.0"
id = "artifacts/visualizer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20016

[services.development]
run = "pnpm --filter @workspace/visualizer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/visualizer", "run", "build" ]
publicDir = "artifacts/visualizer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20016"
BASE_PATH = "/"
